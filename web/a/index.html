<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privado: los buscadores no la muestran; solo la ve quien recibe el enlace -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Actividad · Rutas Galicia</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --fondo:#F3F5F2; --pino:#1E5B44; --tinta:#14261E; --gris:#4A5A52; --suave:#E3E9E4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .marca { display:flex; align-items:center; gap:10px; font-weight:700; color:var(--pino); }
  .insignia { width:34px; height:34px; border-radius:50%; background:var(--pino); color:#fff;
    display:grid; place-items:center; font-size:18px; }
  h1 { font-size: 22px; margin: 16px 0 2px; line-height:1.2; }
  .fecha { color: var(--gris); margin: 0 0 12px; font-size: 14px; }
  .tarjeta { background:#fff; border-radius:20px; padding:12px 8px; box-shadow:0 2px 8px rgba(20,38,30,.08); }
  .datos { display:flex; gap:6px; text-align:center; }
  .datos > div { flex:1; min-width:0; }
  .valor { font-size: clamp(15px, 4.3vw, 19px); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .etiqueta { font-size: 11px; color: var(--gris); }
  .marco { position: relative; margin: 12px 0; border-radius: 20px; overflow: hidden; background:#CFE3EE; }
  #mapa { height: 62vh; min-height: 360px; }
  .directo { position:absolute; left:10px; right:10px; top:10px; display:none; gap:4px;
    background: rgba(5,17,12,.72); color:#fff; border-radius:16px; padding:8px 4px; backdrop-filter: blur(4px); }
  .directo.visible { display:flex; }
  .directo > div { flex:1; text-align:center; min-width:0; }
  .directo .valor { font-size: 17px; }
  .directo .etiqueta { color:#C9D6CF; }
  .mandos { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .play { border:0; background:var(--pino); color:#fff; font-weight:700; font-size:16px;
    padding:12px 18px; border-radius:16px; cursor:pointer; flex: 1 1 200px; }
  .play.parar { background:#B3261E; }
  .chips { display:flex; gap:6px; }
  .chip { border:0; background:var(--suave); color:var(--pino); font-weight:700; font-size:14px;
    padding:8px 11px; border-radius:14px; cursor:pointer; }
  .chip.activo { background:var(--pino); color:#fff; }
  .segmentado { display:inline-flex; background:var(--suave); border-radius:14px; padding:2px; margin-top:12px; }
  .segmentado button { border:0; background:transparent; padding:6px 12px; border-radius:12px; font-weight:600;
    color:var(--gris); cursor:pointer; font-size:13px; }
  .segmentado button.activo { background:#fff; color:var(--tinta); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  canvas { width:100%; height:90px; display:block; margin-top:10px; touch-action: none; }
  .leyenda { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gris); margin-top:4px; }
  .leyenda span.c { width:16px; height:7px; border-radius:2px; display:inline-block; }
  .nota { font-size: 13px; color: var(--gris); margin-top: 14px; line-height: 1.5; }
  .fuente { font-size: 12px; color: var(--gris); margin-top: 10px; line-height:1.5; }
  .fuente a { color: var(--gris); }
  .error { background:#fff; border-radius:20px; padding:20px; text-align:center; color:var(--gris); }
</style>
</head>
<body>
<main>
  <div class="marca"><span class="insignia">⛰</span> Rutas Galicia</div>
  <h1 id="nombre">Cargando la actividad…</h1>
  <p class="fecha" id="fecha"></p>
  <div id="contenido" hidden>
    <div class="tarjeta"><div class="datos" id="datos"></div></div>
    <div class="segmentado" id="vista">
      <button data-vista="plano" class="activo">Plano</button>
      <button data-vista="3d">3D (con relieve)</button>
    </div>
    <div class="marco">
      <div id="mapa"></div>
      <div class="directo" id="directo"></div>
    </div>
    <div class="mandos">
      <button class="play" id="play">▶ Repetir el recorrido</button>
      <div class="chips" id="chips"></div>
    </div>
    <div class="segmentado" id="modos" hidden>
      <button data-modo="velocidad" class="activo">Velocidad</button>
      <button data-modo="pulso">♥ Pulso</button>
    </div>
    <canvas id="perfil"></canvas>
    <div class="leyenda" id="leyenda"></div>
    <p class="nota">🔒 Enlace privado: solo lo ve quien lo recibe. Por privacidad no se muestran
      los primeros ni los últimos 200 m del recorrido.</p>
    <p class="fuente">Mapa: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> ·
      Relieve: <a href="https://registry.opendata.aws/terrain-tiles/">Terrain Tiles</a> (Mapzen, AWS Open Data) ·
      Hecho con Rutas Galicia.</p>
  </div>
</main>
<script>
const FUNCION = 'https://yyosqivweyvpyoxoorrw.supabase.co/functions/v1/compartir';
const COLORES_VEL = ['#D32F2F', '#F57C00', '#FBC02D', '#7CB342', '#2E7D32'];
const COLORES_ZONAS = ['#90A4AE', '#1E88E5', '#43A047', '#FB8C00', '#E53935'];
const VELOCIDADES = [10, 30, 60, 120, 300];

const $ = (id) => document.getElementById(id);
const fallo = (texto) => { $('nombre').textContent = texto; };
const km = (m) => (m / 1000).toFixed(m < 10000 ? 2 : 1).replace('.', ',') + ' km';
const crono = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const ritmo = (kmh) => { if (!(kmh > 0.5)) return '–'; const min = 60 / kmh; let a = Math.floor(min), b = Math.round((min - a) * 60);
  if (b === 60) { a++; b = 0; } return `${a}:${String(b).padStart(2, '0')}`; };
const dato = (valor, etiqueta) => `<div><div class="valor">${valor}</div><div class="etiqueta">${etiqueta}</div></div>`;
const escapar = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const id = new URLSearchParams(location.search).get('id') || '';
if (!/^[\w-]{20,30}$/.test(id)) fallo('Enlace no válido');
else fetch(`${FUNCION}?id=${encodeURIComponent(id)}`)
  .then((r) => r.json())
  .then((a) => (a.error ? fallo(a.error === 'este enlace ya no existe' ? 'Este enlace ya no existe' : 'No se ha podido cargar') : mostrar(a)))
  .catch(() => fallo('No se ha podido cargar la actividad'));

function mostrar(a) {
  // Puntos: [lon, lat, altitud, segundos en movimiento, pulso, tramo, metros]
  const P = a.puntos;
  if (!P || P.length < 2) return fallo('Esta actividad no tiene recorrido');
  const andando = a.tipo === 'senderismo';
  const tipos = { senderismo: 'Senderismo', trail: 'Trail', running: 'Running' };
  document.title = `${a.nombre || 'Actividad'} · Rutas Galicia`;
  $('nombre').textContent = a.nombre || tipos[a.tipo] || 'Actividad';
  if (a.fecha) $('fecha').textContent = [tipos[a.tipo], new Date(a.fecha).toLocaleDateString('es-ES',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })].filter(Boolean).join(' · ');

  // ---- velocidad de cada punto (media de ±15 s) y nivel 0–4 (quintiles)
  const n = P.length, conTiempo = P.every((p) => p[3] !== null);
  const kmh = P.map((p, i) => {
    if (!conTiempo) return null;
    let x = i, y = i;
    while (x > 0 && P[x - 1][5] === p[5] && p[3] - P[x - 1][3] <= 15) x--;
    while (y < n - 1 && P[y + 1][5] === p[5] && P[y + 1][3] - p[3] <= 15) y++;
    const dt = P[y][3] - P[x][3];
    return dt > 0 ? (P[y][6] - P[x][6]) / dt * 3.6 : null;
  });
  const orden = kmh.filter((v) => v > 1).sort((x, y) => x - y);
  const corte = (q) => orden[Math.floor(q * (orden.length - 1))];
  const cortes = orden.length >= 5 ? [corte(.2), corte(.4), corte(.6), corte(.8)] : null;
  const nivelVel = kmh.map((v) => { if (v === null || !cortes) return 2; let k = 0; while (k < 4 && v > cortes[k]) k++; return k; });
  const pulsos = P.map((p) => p[4]).filter((v) => v);
  const hayPulso = pulsos.length > n / 3;
  const pulsoMax = hayPulso ? Math.max(160, ...pulsos) : 0;
  const zona = (hr) => { if (!hr || hr < pulsoMax * .5) return 0; let z = 0; for (const l of [.6, .7, .8, .9]) if (hr >= pulsoMax * l) z++; return z; };
  let modo = 'velocidad';
  const colorDe = (i) => modo === 'pulso' ? COLORES_ZONAS[zona(P[i][4])] : COLORES_VEL[nivelVel[i]];

  // ---- datos de arriba
  const durS = a.duracionMs ? a.duracionMs / 1000 : null;
  const distM = (a.distanciaKm || 0) * 1000 || P[n - 1][6];
  const media = durS ? distM / durS * 3.6 : null;
  $('datos').innerHTML = [
    dato(km(distM), 'Distancia'),
    dato(durS ? crono(durS) : '–', 'Tiempo'),
    andando ? dato(media ? media.toFixed(1).replace('.', ',') + ' km/h' : '–', 'Velocidad media')
            : dato(ritmo(media), 'Ritmo /km'),
    dato(`↑ ${Math.round(a.desnivelPositivo || 0)} m`, 'Desnivel +'),
    ...(hayPulso ? [dato('♥ ' + Math.round(pulsos.reduce((x, y) => x + y, 0) / pulsos.length), 'Pulso medio')] : []),
  ].join('');
  $('contenido').hidden = false;
  if (hayPulso) $('modos').hidden = false;

  // ---- líneas de colores (trozos seguidos del mismo color)
  function lineas(hasta = n - 1) {
    const f = []; let actual = null;
    for (let i = 1; i <= hasta; i++) {
      if (P[i][5] !== P[i - 1][5]) { actual = null; continue; }
      const c = colorDe(i);
      if (!actual || actual.properties.color !== c) {
        actual = { type: 'Feature', properties: { color: c }, geometry: { type: 'LineString', coordinates: [[P[i - 1][0], P[i - 1][1]]] } };
        f.push(actual);
      }
      actual.geometry.coordinates.push([P[i][0], P[i][1]]);
    }
    return { type: 'FeatureCollection', features: f };
  }

  // ---- perfil de altitud
  const lienzo = $('perfil');
  let marcado = null;
  function dibujarPerfil() {
    const r = window.devicePixelRatio || 1, w = lienzo.clientWidth, h = lienzo.clientHeight;
    lienzo.width = w * r; lienzo.height = h * r;
    const g = lienzo.getContext('2d'); g.scale(r, r);
    const al = P.map((p) => p[2]).filter((v) => v !== null);
    const min = Math.min(...al), max = Math.max(...al), rango = Math.max(max - min, 20);
    const barras = Math.min(120, Math.floor(w / 4)), total = P[n - 1][6];
    let j = 0;
    for (let b = 0; b < barras; b++) {
      const obj = b / (barras - 1) * total;
      while (j < n - 1 && P[j + 1][6] <= obj) j++;
      const alto = P[j][2] !== null ? 6 + (P[j][2] - min) / rango * (h - 10) : 6;
      g.globalAlpha = marcado === null || P[j][6] <= P[marcado][6] ? 1 : .3;
      g.fillStyle = colorDe(j);
      g.fillRect(b * w / barras, h - alto, w / barras - 1, alto);
    }
    $('leyenda').innerHTML = (modo === 'pulso' ? 'Suave ' : 'Lento ') +
      (modo === 'pulso' ? COLORES_ZONAS : COLORES_VEL).map((c) => `<span class="c" style="background:${c}"></span>`).join('') +
      (modo === 'pulso' ? ' Máximo' : ' Rápido') + `<span style="margin-left:auto">${Math.round(min)}–${Math.round(max)} m</span>`;
  }
  dibujarPerfil();
  addEventListener('resize', dibujarPerfil);

  // ---- mapa con relieve 3D
  if (typeof maplibregl === 'undefined') { $('mapa').parentNode.hidden = true; return; }
  const caja = P.reduce((c, p) => [Math.min(c[0], p[0]), Math.min(c[1], p[1]), Math.max(c[2], p[0]), Math.max(c[3], p[1])],
    [180, 90, -180, -90]);
  const mapa = new maplibregl.Map({
    container: 'mapa',
    style: {
      version: 8,
      sources: {
        osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>' },
        relieve: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 15,
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'] },
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm' },
        { id: 'sombras', type: 'hillshade', source: 'relieve', layout: { visibility: 'none' }, paint: { 'hillshade-exaggeration': .35 } },
      ],
      sky: { 'sky-color': '#8EC5E8', 'horizon-color': '#E4EFEA', 'sky-horizon-blend': .7, 'horizon-fog-blend': .6, 'fog-color': '#E4EFEA', 'fog-ground-blend': .9 },
    },
    bounds: [[caja[0], caja[1]], [caja[2], caja[3]]],
    fitBoundsOptions: { padding: 40 },
    pitch: 0,
    maxPitch: 80,
    cooperativeGestures: true,
  });
  // Vista: "Plano" (desde arriba, como un mapa normal) o "3D" (inclinado, con relieve).
  let en3D = false;
  function aplicarVista() {
    document.querySelectorAll('#vista button').forEach((b) => b.classList.toggle('activo', (b.dataset.vista === '3d') === en3D));
    if (!mapa.isStyleLoaded()) return mapa.once('load', aplicarVista);
    mapa.setTerrain(en3D ? { source: 'relieve', exaggeration: 1.5 } : null);
    mapa.setLayoutProperty('sombras', 'visibility', en3D ? 'visible' : 'none');
    if (!repitiendo) mapa.fitBounds([[caja[0], caja[1]], [caja[2], caja[3]]], { padding: 40, pitch: en3D ? 55 : 0, bearing: 0, duration: 900 });
  }
  document.querySelectorAll('#vista button').forEach((b) => b.addEventListener('click', () => {
    en3D = b.dataset.vista === '3d';
    aplicarVista();
  }));
  // Si el relieve no carga, el mapa se ve plano (pero se ve).
  mapa.on('error', (e) => { if (e.sourceId === 'relieve' && mapa.getTerrain()) mapa.setTerrain(null); });
  mapa.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
  mapa.on('load', () => {
    mapa.addSource('ruta', { type: 'geojson', data: lineas() });
    mapa.addSource('hecho', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    mapa.addSource('estela', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    mapa.addSource('punto', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    const redondo = { 'line-cap': 'round', 'line-join': 'round' };
    mapa.addLayer({ id: 'noche', type: 'background', paint: { 'background-color': '#05110C', 'background-opacity': 0 } }, 'sombras');
    mapa.addLayer({ id: 'borde', type: 'line', source: 'ruta', layout: redondo, paint: { 'line-color': '#fff', 'line-width': 8 } });
    mapa.addLayer({ id: 'linea', type: 'line', source: 'ruta', layout: redondo, paint: { 'line-color': ['get', 'color'], 'line-width': 5 } });
    mapa.addLayer({ id: 'hecho-brillo', type: 'line', source: 'hecho', layout: redondo,
      paint: { 'line-color': ['get', 'color'], 'line-width': 16, 'line-blur': 9, 'line-opacity': .75 } });
    mapa.addLayer({ id: 'hecho', type: 'line', source: 'hecho', layout: redondo, paint: { 'line-color': ['get', 'color'], 'line-width': 5 } });
    mapa.addLayer({ id: 'estela', type: 'line', source: 'estela', layout: redondo, paint: { 'line-color': '#fff', 'line-width': 3 } });
    mapa.addLayer({ id: 'punto', type: 'circle', source: 'punto',
      paint: { 'circle-radius': 8, 'circle-color': '#fff', 'circle-stroke-width': 5, 'circle-stroke-color': ['get', 'color'] } });
  });

  // ---- modo velocidad / pulso
  document.querySelectorAll('#modos button').forEach((b) => b.addEventListener('click', () => {
    modo = b.dataset.modo;
    document.querySelectorAll('#modos button').forEach((x) => x.classList.toggle('activo', x === b));
    if (mapa.getSource('ruta')) mapa.getSource('ruta').setData(lineas());
    if (marcado !== null) mapa.getSource('hecho')?.setData(lineas(marcado));
    dibujarPerfil();
  }));

  // ---- repetición
  let velocidad = 60, repitiendo = false, virtual = 0, j = 0, antes = 0, rumbo = 0, ultimoDibujo = 0;
  $('chips').innerHTML = VELOCIDADES.map((x) => `<button class="chip${x === velocidad ? ' activo' : ''}" data-x="${x}">×${x}</button>`).join('');
  $('chips').addEventListener('click', (e) => {
    const x = Number(e.target.dataset.x); if (!x) return;
    velocidad = x;
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', Number(c.dataset.x) === x));
  });
  if (!conTiempo) $('play').hidden = true, $('chips').hidden = true;

  const rumboEntre = (p, q) => { const r = Math.PI / 180;
    const y = Math.sin((q[0] - p[0]) * r) * Math.cos(q[1] * r);
    const x = Math.cos(p[1] * r) * Math.sin(q[1] * r) - Math.sin(p[1] * r) * Math.cos(q[1] * r) * Math.cos((q[0] - p[0]) * r);
    return (Math.atan2(y, x) / r + 360) % 360; };

  function directo(i) {
    const p = P[i];
    $('directo').innerHTML = [
      dato(crono(p[3]), 'Tiempo'), dato(km(p[6]), 'Distancia'),
      andando ? dato(kmh[i] ? kmh[i].toFixed(1).replace('.', ',') + ' km/h' : '–', 'Velocidad') : dato(ritmo(kmh[i]), 'Ritmo /km'),
      dato(p[2] !== null ? Math.round(p[2]) + ' m' : '–', 'Altitud'),
      ...(hayPulso ? [dato(p[4] ? '♥ ' + p[4] : '–', 'Pulso')] : []),
    ].join('');
  }

  function paso(ahora) {
    if (!repitiendo) return;
    virtual += (ahora - antes) / 1000 * velocidad; antes = ahora;
    if (virtual >= P[n - 1][3]) { parar(); return; }
    while (j < n - 1 && P[j + 1][3] <= virtual) j++;
    let k = j; while (k < n - 1 && P[k][6] - P[j][6] < 60) k++;
    if (k !== j) { let d = rumboEntre(P[j], P[k]) - rumbo; d = ((d + 540) % 360) - 180; rumbo = (rumbo + d * .06 + 360) % 360; }
    mapa.jumpTo(en3D
      ? { center: [P[j][0], P[j][1]], bearing: rumbo, pitch: 62, zoom: 15.3 }
      : { center: [P[j][0], P[j][1]], bearing: 0, pitch: 0, zoom: 15 });
    if (ahora - ultimoDibujo > 120) {
      ultimoDibujo = ahora; marcado = j;
      mapa.getSource('hecho').setData(lineas(j));
      let d = j; while (d > 0 && P[j][6] - P[d - 1][6] < 250 && P[d - 1][5] === P[j][5]) d--;
      mapa.getSource('estela').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: P.slice(d, j + 1).map((p) => [p[0], p[1]]) } });
      mapa.getSource('punto').setData({ type: 'Feature', properties: { color: colorDe(j) }, geometry: { type: 'Point', coordinates: [P[j][0], P[j][1]] } });
      directo(j); dibujarPerfil();
    }
    requestAnimationFrame(paso);
  }
  function empezar() {
    repitiendo = true; virtual = 0; j = 0; antes = performance.now();
    rumbo = rumboEntre(P[0], P[Math.min(n - 1, 10)]);
    $('play').textContent = '■ Parar'; $('play').classList.add('parar'); $('directo').classList.add('visible');
    mapa.setPaintProperty('noche', 'background-opacity', .55);
    mapa.setPaintProperty('linea', 'line-opacity', .3);
    mapa.setPaintProperty('borde', 'line-opacity', 0);
    $('mapa').scrollIntoView({ behavior: 'smooth', block: 'center' });
    requestAnimationFrame(paso);
  }
  function parar() {
    repitiendo = false; marcado = null;
    $('play').textContent = '▶ Repetir el recorrido'; $('play').classList.remove('parar'); $('directo').classList.remove('visible');
    mapa.setPaintProperty('noche', 'background-opacity', 0);
    mapa.setPaintProperty('linea', 'line-opacity', 1);
    mapa.setPaintProperty('borde', 'line-opacity', 1);
    for (const s of ['hecho', 'estela', 'punto']) mapa.getSource(s).setData({ type: 'FeatureCollection', features: [] });
    mapa.fitBounds([[caja[0], caja[1]], [caja[2], caja[3]]], { padding: 40, pitch: en3D ? 55 : 0, bearing: 0, duration: 1200 });
    dibujarPerfil();
  }
  $('play').addEventListener('click', () => (repitiendo ? parar() : empezar()));
}
</script>
</body>
</html>
